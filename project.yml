name: AgentServer
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  AgentCore:
    path: .
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: 2.0.0
fileGroups:
  - README.md
  - AGENTS.md
  - docs
  - Agents
  - Package.swift
  - Sources/AgentServer/Web
targets:
  AgentServer:
    type: tool
    platform: macOS
    sources:
      - path: Sources/AgentServer
        excludes:
          - Web
    dependencies:
      - package: AgentCore
        product: AgentCore
      - package: Hummingbird
        product: Hummingbird
    postBuildScripts:
      - name: Copy web pages
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/Web"
          cp "${SRCROOT}/Sources/AgentServer/Web/"*.html "${TARGET_BUILD_DIR}/Web/"
        basedOnDependencyAnalysis: false
schemes:
  AgentServer:
    build:
      targets:
        AgentServer: all
    run:
      config: Debug
      customWorkingDirectory: "$(PROJECT_DIR)"
      environmentVariables:
        AGENT_SERVER_PORT: "8080"
        AGENT_SERVER_AGENTS_DIR: "$(PROJECT_DIR)/Agents"
