name: AgentServer
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path"
packages:
  AgentCore:
    path: Packages/AgentServer
  NewsResearcher:
    path: Packages/AgentServer/Agents/NewsResearcher
  ScriptRefiner:
    path: Packages/AgentServer/Agents/ScriptRefiner
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: 2.27.1
  ServiceLifecycle:
    url: https://github.com/swift-server/swift-service-lifecycle.git
    from: 2.12.1
fileGroups:
  - Documentation
  - Packages/AgentServer/AGENTS.md
  - Packages/AgentServer/Package.swift
  - Packages/AgentServer/config
  - Packages/AgentServer/Sources/AgentResources/Web
targets:
  AgentTools:
    type: tool
    platform: macOS
    sources:
      - path: Packages/AgentServer/Sources/AgentTools
    dependencies:
      - package: AgentCore
        product: AgentCore
  AgentValidator:
    type: tool
    platform: macOS
    sources:
      - path: Packages/AgentServer/Sources/AgentValidator
    dependencies:
      - package: AgentCore
        product: AgentCore
  AgentServer:
    type: tool
    platform: macOS
    sources:
      - path: Packages/AgentServer/Sources/AgentServer
      - path: "${DERIVED_FILE_DIR}/GeneratedAgentValidationCatalog.swift"
        # Created by Validate Agents; it must remain in Compile Sources even before it exists.
        type: file
        group: Generated Sources
        buildPhase: sources
        optional: true
    dependencies:
      - target: AgentValidator
      - package: AgentCore
        product: AgentCore
      - package: NewsResearcher
        product: NewsResearcher
      - package: ScriptRefiner
        product: ScriptRefiner
      - package: Hummingbird
        product: Hummingbird
      - package: ServiceLifecycle
        product: ServiceLifecycle
    preBuildScripts:
      - name: Validate Agents
        script: |
          mkdir -p "${DERIVED_FILE_DIR}"
          "${BUILT_PRODUCTS_DIR}/AgentValidator" "${SRCROOT}/Packages/AgentServer/Agents" "${TARGET_BUILD_DIR}/agent-validation.json" "${DERIVED_FILE_DIR}/GeneratedAgentValidationCatalog.swift"
        inputFiles:
          - "${SRCROOT}/Packages/AgentServer/Agents"
        outputFiles:
          - "${DERIVED_FILE_DIR}/GeneratedAgentValidationCatalog.swift"
          - "${TARGET_BUILD_DIR}/agent-validation.json"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy web pages
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/Web"
          cp "${SRCROOT}/Packages/AgentServer/Sources/AgentResources/Web/"*.html "${SRCROOT}/Packages/AgentServer/Sources/AgentResources/Web/"*.js "${TARGET_BUILD_DIR}/Web/"
          mkdir -p "${TARGET_BUILD_DIR}/config"
          cp "${SRCROOT}/Packages/AgentServer/config/server.json" "${TARGET_BUILD_DIR}/config/server.json"
        basedOnDependencyAnalysis: false
schemes:
  AgentServer:
    build:
      targets:
        AgentServer: all
    run:
      config: Debug
      customWorkingDirectory: "$(BUILT_PRODUCTS_DIR)"
      environmentVariables:
        AGENT_SERVER_CONFIG: "$(BUILT_PRODUCTS_DIR)/config/server.json"
        AGENT_SERVER_ENV: development
  AgentServer-Stop:
    build:
      targets:
        AgentServer: all
    run:
      config: Debug
      customWorkingDirectory: "$(BUILT_PRODUCTS_DIR)"
      commandLineArguments:
        stop: true
      environmentVariables:
        AGENT_SERVER_CONFIG: "$(BUILT_PRODUCTS_DIR)/config/server.json"
        AGENT_SERVER_ENV: development
